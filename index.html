th="600" height="736" aria-hidden="true"></canvas><div class="status" id="status">안녕하세요! 버튼을 눌러 주세요.</div></div><button id="listen">🎤 말하기 (마이크 시험)</button><button id="speak">🔊 그레이슨 인사 듣기</button><p id="heard" style="font-size:17px;line-height:1.5">인식한 말: 아직 없음</p><p class="note">무료 음성 인식 시험용입니다. 일부 갤럭시 크롬에서는 휴대폰에 저장된 HTML 파일(file://)의 마이크 사용이 제한될 수 있습니다. 그 경우 안전한 HTTPS 웹페이지로 옮겨야 합니다. 자유로운 AI 대화와 발음에 정확히 맞는 입술 동기화는 아직 지원하지 않습니다. 말하는 동안 입 부분이 간단히 움직입니다.</p></main><script>
const portrait=document.getElementById('portrait');
const mouthCanvas=document.getElementById('mouthCanvas');
const ctx=mouthCanvas.getContext('2d');
let mouthTimer=null, mouthPhase=0;
function mouthFrame(){
  if(!portrait.complete || !portrait.naturalWidth)return;
  const W=600,H=736;
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(portrait,0,0,W,H);
  // Animate only the mouth area of the original photograph.
  // This is an approximate animation, not phoneme-accurate lip sync.
  const cx=321,cy=337,rx=61,ry=31;
  const openness=.10+.90*Math.abs(Math.sin(mouthPhase));
  const scale=1+openness*.34;
  ctx.save();ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.clip();
  ctx.drawImage(portrait,cx-rx,cy-ry,rx*2,ry*2,cx-rx,cy-ry*scale,rx*2,ry*2*scale);
  ctx.restore();mouthPhase+=.64;
}
function startMouth(){stopMouth();mouthFrame();mouthTimer=setInterval(mouthFrame,95)}
function stopMouth(){if(mouthTimer!==null){clearInterval(mouthTimer);mouthTimer=null}ctx.clearRect(0,0,600,736)}
const frame=document.getElementById('frame'),status=document.getElementById('status'),heard=document.getElementById('heard'),listen=document.getElementById('listen');
function reply(t){let answer='말씀 잘 들었어요. 아직은 간단한 대화만 할 수 있어요.';if(/안녕|반가/.test(t))answer='안녕하세요! 오늘도 만나서 반가워요.';else if(/이름|누구/.test(t))answer='저는 그레이슨이에요. 친근한 여자 동생으로 함께할게요.';else if(/고마|감사/.test(t))answer='저도 고마워요!';else if(/잘 지내|기분/.test(t))answer='네, 잘 지내고 있어요. 오늘 기분은 어떠세요?';else if(/날씨/.test(t))answer='실시간 날씨는 아직 연결되지 않았어요.';say(answer)}
function say(t){if(!window.speechSynthesis){status.textContent='음성 읽기를 지원하지 않습니다.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.92;u.pitch=1.15;const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('ko'));if(v.length)u.voice=v.find(x=>/female|여성/i.test(x.name))||v[0];u.onstart=()=>{frame.classList.add('speaking');startMouth();status.textContent='그레이슨이 대답하고 있어요.'};u.onend=u.onerror=()=>{frame.classList.remove('speaking');stopMouth();status.textContent='대답이 끝났어요.'};speechSynthesis.speak(u)}
document.getElementById('speak').onclick=()=>say('안녕하세요! 저는 그레이슨이에요. 반가워요!');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
listen.onclick=()=>{if(!SR){status.textContent='이 크롬에서는 음성 인식을 지원하지 않습니다.';return}const r=new SR();r.lang='ko-KR';r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{status.textContent='듣고 있어요. 말씀해 주세요.';listen.disabled=true};r.onresult=e=>{const t=e.results[0][0].transcript;heard.textContent='인식한 말: '+t;reply(t)};r.onerror=e=>{status.textContent='마이크 오류: '+e.error+' (파일 실행 제한일 수 있습니다)'};r.onend=()=>{listen.disabled=false};try{r.start()}catch(e){listen.disabled=false;status.textContent='마이크 시작 실패: '+e.message}};
</script></body></html>
